name: CI

# Full test suite, PostgreSQL RLS checks and client type/build checks (Audit I-18).
# evals.yml keeps the retrieval-quality gate; this workflow gates correctness and security.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ENVIRONMENT: test
  PRIVACY_MODE: local
  LLM_PROVIDER: fake

jobs:
  backend:
    name: Backend tests (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    env:
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libtesseract-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.fastembed-cache
          key: fastembed-all-MiniLM-L6-v2-${{ hashFiles('apps/api/requirements.txt') }}

      # The test suite blocks outbound network (tests/conftest.py), so fetch the model first
      - name: Pre-fetch embedding model
        run: python -c "from app.services.embeddings import embed_texts; embed_texts(['warm up'])"

      - name: Run test suite
        run: python -m pytest -q -rs

  postgres:
    name: PostgreSQL migrations + RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A non-superuser owner role: superusers and BYPASSRLS roles ignore row-level security
      APP_DB_URL: postgresql+psycopg://vrrag_app:ci-only-password@127.0.0.1:5432/vrrag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create application role and database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE vrrag_app LOGIN PASSWORD 'ci-only-password' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;" \
            -c "CREATE DATABASE vrrag OWNER vrrag_app;"

      - name: Startup check (migrations to head, RLS enabled + forced, role cannot bypass)
        env:
          DATABASE_URL: ${{ env.APP_DB_URL }}
        run: python -c "from app.db import sqlite; sqlite.init_db(); sqlite.init_db(); print('ok')"

      - name: PostgreSQL-gated tests
        env:
          TEST_DATABASE_URL: ${{ env.APP_DB_URL }}
        run: python -m pytest -q -rs tests/db tests/test_token_budget_usage.py

  web:
    name: Web typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
