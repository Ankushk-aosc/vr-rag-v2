name: RAG Evaluation Harness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly run at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run (fast or all)'
        required: true
        default: 'fast'
        type: choice
        options:
          - fast
          - all

jobs:
  eval-fast-pr:
    name: Fast Eval Suite (CI / PR)
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'fast')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr libtesseract-dev

      - name: Install Dependencies
        run: |
          pip install --no-input -r requirements.txt
          pip install --no-input pytest pytest-asyncio pytest-cov

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.fastembed-cache
          key: fastembed-all-MiniLM-L6-v2-${{ hashFiles('apps/api/requirements.txt') }}

      - name: Generate Evaluation Corpus & Golden Dataset
        env:
          FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed-cache
        run: |
          python evals/generate_corpus.py
          python evals/generate_golden.py

      - name: Run Fast Evaluation Suite
        env:
          FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed-cache
        run: |
          python -m evals.run --suite fast --out evals/results/eval_results.json --report evals/results/eval_report.md

      - name: Run Harness Self-Test (Broken Retriever Verification)
        run: |
          python -m evals.run --self-test

      - name: Run Unit Tests
        run: |
          pytest -rs tests/test_evals_harness.py

      - name: Upload Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-results
          path: apps/api/evals/results/
          retention-days: 14

  eval-nightly:
    name: Nightly Evaluation Suite (Real LLM)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'all')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      # The real-LLM suite needs the GROQ_API_KEY repository secret; without it, skip with a visible warning
      - name: Check for Groq API key
        id: keys
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -n "$GROQ_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Nightly eval skipped::Add a GROQ_API_KEY repository secret (Settings > Secrets and variables > Actions) to run the real-LLM evaluation."
          fi

      - name: Install System Dependencies
        if: steps.keys.outputs.available == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr libtesseract-dev

      - name: Install Dependencies
        if: steps.keys.outputs.available == 'true'
        run: |
          pip install --no-input -r requirements.txt

      - name: Run Full Nightly Evaluation Suite
        if: steps.keys.outputs.available == 'true'
        env:
          # The real-LLM eval sends the synthetic eval corpus (no customer data) to Groq, which is
          # only allowed in the explicit cloud privacy mode; the default is local (Audit I-09)
          PRIVACY_MODE: cloud
          LLM_PROVIDER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: |
          python evals/generate_corpus.py
          python evals/generate_golden.py
          python -m evals.run --suite all --real-llm --out evals/results/nightly_eval_results.json --report evals/results/nightly_eval_report.md

      - name: Upload Nightly Evaluation Artifacts
        if: always() && steps.keys.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-rag-eval-results
          path: apps/api/evals/results/
          retention-days: 30

