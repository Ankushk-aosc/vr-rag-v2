# Local stack: PostgreSQL + API + web (Audit I-17).
# Copy .env.example to .env and fill in the required values, then: docker compose up --build
# With PRIVACY_MODE=local (default) the API talks to an LLM server on the host, e.g. Ollama on port 11434.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vr_rag_postgres
    restart: unless-stopped
    environment:
      # Administrative superuser: used only by docker/postgres/init-app-role.sh, never by the API
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:-vrrag_owner}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?set MIGRATION_DB_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:-vrrag_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      APP_DB_NAME: ${APP_DB_NAME:-vr_rag}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-init-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${APP_DB_NAME:-vr_rag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: vr_rag_api
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set APP_SECRET_KEY in .env}
      # Non-superuser role, so PostgreSQL row-level security applies; migrations run at startup
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-vrrag_app}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@postgres:5432/${APP_DB_NAME:-vr_rag}
      PRIVACY_MODE: ${PRIVACY_MODE:-local}
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      # 127.0.0.1 inside a container is the container itself, so this has its own variable
      LOCAL_LLM_BASE_URL: ${DOCKER_LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen3:8b}
      # Only read when PRIVACY_MODE=cloud
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - api_data:/data
      - api_models:/models
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Compiled into the browser bundle: the address the browser uses to reach the API
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: vr_rag_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  api_data:
  api_models:
